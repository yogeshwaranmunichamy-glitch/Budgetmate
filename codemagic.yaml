workflows:
  android-workflow:
    name: BudgetMate Android Build
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Generate native Android project files
        script: |
          flutter create --platforms=android .
      - name: Get packages
        script: |
          flutter pub get
      - name: Build APK (release)
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/**/*.apk
