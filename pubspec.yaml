name: budgetmate
description: ML-powered personal budget manager (no generative AI) — Flutter native app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  fl_chart: ^0.68.0
  speech_to_text: ^7.0.0
  intl: ^0.19.0
  crypto: ^3.0.3
  uuid: ^4.4.0
  csv: ^6.0.0
  path_provider: ^2.1.3
  share_plus: ^9.0.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
